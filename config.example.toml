# Bu dosyayı config.toml olarak kopyala ve doldur.

[riot]
api_key = "RGAPI-xxxxxxxx"     # developer.riotgames.com
platform = "TR1"
game_name = "OyuncuAdın"        # sadece `process` komutu için; watch client'tan okur
tag_line = "TR1"

[lol]
install_dir = "C:/Riot Games/League of Legends"

[obs]
host = "localhost"
port = 4455                     # OBS > Araçlar > WebSocket Sunucu Ayarları
exe = "D:/SteamLibrary/steamapps/common/OBS Studio/bin/64bit/obs64.exe"   # kapalıysa otomatik açılır
recordings_dir = "D:/lol-highlights/recordings"   # OBS kayıt yolu ile aynı olmalı
keep_recordings = 1          # en yeni kaç maçın tam kaydı kalsın (0 = hepsini sil)
password = ""

[clips]
output_dir = "clips"
ffmpeg_dir = "D:/Tools/ffmpeg/ffmpeg-9.0.2-full_build/bin"   # boşsa PATH'e bakılır
merge_gap = 3.0                 # aradaki boşluk bu kadar saniyeden azsa klipleri birleştir
reencode = true                 # true: tam saniyesinde keser (önerilen). false: hızlı ama birkaç sn kayabilir

[rules]
# Mevcut: my_kills, my_deaths, my_assists
enabled = ["my_kills", "my_deaths"]
pre = 10.0
post = 5.0

[rules.my_deaths]
pre = 15.0                      # ölümlerde neyin yanlış gittiğini görmek için daha uzun
